<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
	<title>Edit Event</title>
	<link rel="stylesheet" href="../../css/default.css" th:href="@{/css/default.css}">
	<style>
		.venue-detail h1 {
			font-size: 2rem;
			font-weight: 700;
			color: #222;
			margin-bottom: 16px;
			padding-bottom: 12px;
			border-bottom: 2px solid #f0e8e4;
		}
	</style>
</head>
<body>
  <div layout:fragment="content">
    <div class="venue-detail">
      <h1 class="mt-4">Edit Event</h1>

      <form th:action="@{/events/{id}(id=${event.id})}" th:object="${event}" method="post">
        <input type="hidden" name="_method" value="patch" />
        <input type="hidden" name="returnTo" th:if="${cancelReturnTo != null}" th:value="${cancelReturnTo}" />

        <div class="form-group mb-3">
          <label for="event-name" class="form-label">Name</label>
          <input type="text" id="event-name" class="form-control" th:field="*{name}" placeholder="Name" />
          <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></p>
        </div>

        <div class="form-group mb-3">
          <label for="event-date" class="form-label">Date</label>
          <input type="date" id="event-date" class="form-control" th:field="*{date}" />
          <p th:if="${#fields.hasErrors('date')}" th:errors="*{date}" class="text-danger"></p>
        </div>

        <div class="form-group mb-3">
          <label for="event-time" class="form-label">Time</label>
          <input type="time" id="event-time" class="form-control" th:field="*{time}" />
          <p th:if="${#fields.hasErrors('time')}" th:errors="*{time}" class="text-danger"></p>
        </div>

        <div class="form-group mb-3">
          <label for="event-venue" class="form-label">Venue</label>
          <select id="event-venue" class="form-select" th:field="*{venue}">
            <option th:each="v : ${venues}" th:value="${v.id}" th:text="${v.name}"></option>
          </select>
          <p th:if="${#fields.hasErrors('venue')}" th:errors="*{venue}" class="text-danger"></p>
        </div>

        <div class="form-group mb-3">
          <label for="event-description" class="form-label">Description</label>
          <textarea id="event-description" class="form-control" th:field="*{description}" rows="4" placeholder="Description (optional)"></textarea>
          <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger"></p>
        </div>

        <div class="d-flex gap-2 flex-wrap align-items-center">
          <button type="submit" class="btn btn-primary">Save changes</button>
          <a class="btn btn-primary" role="button" th:if="${cancelReturnTo != null}"
             th:href="@{/events/{id}(id=${event.id},returnTo=${cancelReturnTo})}">Cancel</a>
          <a class="btn btn-primary" role="button" th:unless="${cancelReturnTo != null}" th:href="@{/events}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
