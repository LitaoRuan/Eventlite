<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>EventLite</title>
</head>
<body>
  <div layout:fragment="content">
    
    <h1 class="mt-4 mb-4">Welcome to EventLite</h1>

    <h2>Upcoming Events</h2>
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th><i class="fa-solid fa-bolt"></i> Event</th>
          <th><i class="fa-solid fa-calendar"></i> Date</th>
          <th><i class="fa-solid fa-clock"></i> Time</th>
          <th><i class="fa-solid fa-map-marker-alt"></i> Venue</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="e : ${upcomingEvents}">
          <td><a th:href="@{/events/{id}(id=${e.id},returnTo='/')}" th:text="${e.name}">Event</a></td>
          <td th:text="${{e.date}}">Date</td>
          <td th:text="${{e.time}}">Time</td>
          <td>
            <span th:if="${e.venue != null}">
              <a th:href="@{/venues/{id}(id=${e.venue.id},returnTo='/')}" th:text="${e.venue.name}">Venue</a>
            </span>
            <span th:if="${e.venue == null}">No venue</span>
          </td>
        </tr>
      </tbody>
    </table>

    <h2 class="mt-4">Top 3 Venues</h2>
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th><i class="fa-solid fa-map-marker-alt"></i> Venue</th>
          <th><i class="fa-solid fa-location-dot"></i> Address</th>
          <th><i class="fa-solid fa-users"></i> Capacity</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="v : ${topVenues}">
          <td><a th:href="@{/venues/{id}(id=${v.id},returnTo='/')}" th:text="${v.name}">Venue</a></td>
          <td th:text="${v.address}">Address</td>
          <td th:text="${v.capacity}">Capacity</td>
        </tr>
      </tbody>
    </table>

  </div>
</body>
</html>
