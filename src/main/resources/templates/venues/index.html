<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>All Venues</title>
</head>
<body>
    <div layout:fragment="content">

        <h1 class="mt-4 mb-3">Venues</h1>

        <!-- Search bar + Add button -->
        <div class="d-flex align-items-center gap-2 mb-4">
            <form action="/venues" method="get" class="d-flex align-items-center gap-2 mb-0" style="flex: 1;">
                <input type="text" id="search-input" name="search_query"
                       th:value="${search_query}"
                       placeholder="Search for a venue..."
                       style="flex: 1; padding: 6px 10px; margin: 0;">
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-magnifying-glass"></i> Search
                </button>
            </form>
			<a class="btn btn-primary" role="button" th:href="@{/venues}">
				    <i class="fa-solid fa-cancel"></i> Clear
				  </a>
            <a class="btn btn-primary" role="button" th:href="@{/venues/new}" sec:authorize="isAuthenticated()">
                <i class="fa-solid fa-plus"></i> New venue
            </a>
        </div>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th><i class="fa-solid fa-map-marker-alt"></i> Venue</th>
                    <th><i class="fa-solid fa-location-dot"></i> Address</th>
                    <th><i class="fa-solid fa-users"></i> Capacity</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="v : ${venues}">
                    <td>
                        <a th:href="@{/venues/{id}(id=${v.id},returnTo='/venues')}" th:text="${v.name}">My Venue</a>
                    </td>
                    <td th:text="${v.address}">Address</td>
                    <td th:text="${v.capacity}">Capacity</td>
                </tr>
            </tbody>
        </table>

    </div>
</body>
</html>
