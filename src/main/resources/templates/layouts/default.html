<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title layout:title-pattern="$LAYOUT_TITLE: $CONTENT_TITLE">EventLite</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/webjars/font-awesome/css/all.min.css" />
  <link rel="stylesheet" href="../../css/default.css" th:href="@{css/default.css}">
</head>
<body>

	<nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: #800000; padding: 6px 20px;">
	    <div class="container-fluid">
	      <a class="navbar-brand" th:href="@{/}" style="color: #FFFAFA; font-weight: bold; font-size: 1.3rem;">
	        EventLite
	      </a>
	      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
	              aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
	        <span class="navbar-toggler-icon"></span>
	      </button>
	      <div class="collapse navbar-collapse" id="navbarMain">
	        <ul class="navbar-nav me-auto" style="gap: 20px;">
	          <li class="nav-item">
	            <a class="nav-link" th:href="@{/}" style="color: #FFFAFA;">
	              <i class="fa-solid fa-house"></i> Home
	            </a>
	          </li>
	          <li class="nav-item">
	            <a class="nav-link" th:href="@{/events}" style="color: #FFFAFA;">
	              <i class="fa-solid fa-bolt"></i> Events
	            </a>
	          </li>
	          <li class="nav-item">
	            <a class="nav-link" th:href="@{/venues}" style="color: #FFFAFA;">
	              <i class="fa-solid fa-map-marker-alt"></i> Venues
	            </a>
	          </li>
	        </ul>

	        <!-- Auth on the right -->
	        <ul class="navbar-nav ms-auto">
	          <li class="nav-item" sec:authorize="!isAuthenticated()">
	            <a class="nav-link" th:href="@{/sign-in}" style="color: #FFFAFA;">
	              <i class="fa-solid fa-sign-in-alt"></i> Sign in
	            </a>
	          </li>
	          <li class="nav-item d-flex align-items-center" sec:authorize="isAuthenticated()">
	            <form th:action="@{/sign-out}" method="post" class="mb-0 d-flex flex-wrap align-items-center gap-2">
	              <span style="color: #FFFAFA;">
	                <i class="fa-solid fa-user"></i> <span sec:authentication="name"></span>
	              </span>
	              <button type="submit" class="btn btn-primary btn-sm">
	                <i class="fa-solid fa-sign-out-alt"></i> Sign out
	              </button>
	            </form>
	          </li>
	        </ul>
	      </div>
	    </div>
	</nav>

  <div class="container mt-3">
   

    <div layout:fragment="content">
      Main page body goes here...
    </div>
  </div>

  <script type="text/javascript" src="/webjars/popper.js/umd/popper.min.js"></script>
  <script type="text/javascript" src="/webjars/bootstrap/js/bootstrap.min.js"></script>
  
</body>
</html>
