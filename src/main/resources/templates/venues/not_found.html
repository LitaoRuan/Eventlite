<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../css/default.css" th:href="@{/css/default.css}">
    <title>Venue Not Found</title>
</head>
<body>
  <div layout:fragment="content">
    <h1>Venue not found</h1>

    <p>
      Sorry, venue <span th:text="${not_found_id}">0</span> was not found.
    </p>

    <p>
      <a class="btn btn-primary" role="button" th:href="@{/venues}"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Venues list</a>
    </p>
  </div>
</body>
</html>
