<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Add Venue</title>
    <link rel="stylesheet" href="../../css/default.css" th:href="@{/css/default.css}">
    <style>
        .venue-detail h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #222;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0e8e4;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="venue-detail">
            <h1 class="mt-4">Add Venue</h1>

            <form th:action="@{/venues}" th:object="${venue}" method="post">

                <div class="form-group mb-3">
                    <label for="venue-name" class="form-label">Name</label>
                    <input type="text" id="venue-name" th:field="*{name}" class="form-control" placeholder="Name" />
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></p>
                </div>

                <div class="form-group mb-3">
                    <label for="venue-address" class="form-label">Address</label>
                    <input type="text" id="venue-address" th:field="*{address}" class="form-control" placeholder="e.g. Oxford Road M13 9PL" />
                    <small class="text-muted">Must include a valid UK postcode (e.g., M13 9PL).</small>
                    <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-danger"></p>
                </div>

                <div class="form-group mb-3">
                    <label for="venue-capacity" class="form-label">Capacity</label>
                    <input type="number" id="venue-capacity" th:field="*{capacity}" class="form-control" placeholder="Capacity" />
                    <p th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}" class="text-danger"></p>
                </div>

                <div class="d-flex gap-2 flex-wrap align-items-center">
                    <button type="submit" class="btn btn-primary">Add venue</button>
                    <a class="btn btn-primary" role="button" th:href="@{/venues}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
