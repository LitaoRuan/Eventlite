<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
  <title>All events</title>
  <link rel="stylesheet" href="../../static/css/default.css" th:href="@{/css/default.css}">
  
  <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js'></script>
  <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css' rel='stylesheet' />
  
  <style>
      .mapboxgl-marker, .mapboxgl-marker * {
          background-color: transparent !important;
          background: none !important;
          border: none !important;
          box-shadow: none !important;
      }
      #map {
          width: 100%;           
          height: 500px; 
          border-radius: 8px;
          border: 1px solid #ddd;
          box-shadow: 0 4px 10px rgba(0,0,0,0.05);
          margin-bottom: 30px;
      }
      .mapboxgl-ctrl-top-left, .mapboxgl-ctrl-top-right,
      .mapboxgl-ctrl-bottom-left, .mapboxgl-ctrl-bottom-right {
          display: none !important;
      }
      .mapboxgl-popup {
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
          max-width: none !important; 
      }
      .mapboxgl-popup-tip { display: none !important; }
      .mapboxgl-popup-content {
          background-color: #ffffff !important;
          padding: 10px 30px 10px 15px !important; 
          border-radius: 6px !important; 
          box-shadow: 0 4px 15px rgba(0,0,0,0.15) !important;
          text-align: center !important; 
          border: none !important; 
          width: max-content !important; 
          margin: 0 !important;
          font-family: Arial, sans-serif !important;
          line-height: 1.2 !important;
      }
      .mapboxgl-popup-close-button {
          font-size: 18px !important;
          color: #888 !important;
          background: transparent !important;
          border: none !important;
          outline: none !important; 
          box-shadow: none !important; 
          padding: 4px 8px !important;
          right: 0 !important;
          top: 0 !important;
          line-height: 1 !important;
      }
      .mapboxgl-popup-close-button:hover,
      .mapboxgl-popup-close-button:focus {
          color: #000 !important;
          background: transparent !important;
          border: none !important;
          outline: none !important; 
          box-shadow: none !important;
      }
  </style>
</head>
<body>
  <div layout:fragment="content">

    <h1 class="mt-4 mb-3">Events</h1>

    
    <div class="d-flex align-items-center gap-2 mb-4">
      <form action="/events" method="get" class="d-flex align-items-center gap-2 mb-0" style="flex: 1;">
        <input type="text" id="search-input" name="search_query" 
               th:value="${search_query}"
               placeholder="Search for an event..."
               style="flex: 1; padding: 6px 10px; margin: 0;">
        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-magnifying-glass"></i> Search
        </button>
      </form>
	  <a class="btn btn-primary" role="button" th:href="@{/events}">
	    <i class="fa-solid fa-cancel"></i> Clear
	  </a>
      <a class="btn btn-primary" role="button" th:href="@{/events/new}" sec:authorize="isAuthenticated()">
        <i class="fa-solid fa-plus"></i> New event
      </a>
    </div>

    <h2>Upcoming events</h2>
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th><i class="fa-solid fa-bolt"></i> Event</th>
          <th><i class="fa-solid fa-calendar"></i> Date</th>
          <th><i class="fa-solid fa-clock"></i> Time</th>
          <th><i class="fa-solid fa-map-marker-alt"></i> Venue</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="e : ${upcoming}">
          <td><a th:href="@{/events/{id}(id=${e.id},returnTo='/events')}" th:text="${e.name}">My Event</a></td>
          <td th:text="${{e.date}}">Event date</td>
          <td th:text="${e.time != null ? e.time.getHour() + 1 + ':' + #temporals.format(e.time, 'mm') : ''}">15:00</td>
          <td>
            <span th:if="${e.venue != null}">
              <a th:href="@{/venues/{id}(id=${e.venue.id},returnTo='/events')}" th:text="${e.venue.name}">Venue</a>
            </span>
            <span th:if="${e.venue == null}">No venue</span>
          </td>
        </tr>
      </tbody>
    </table>

    <h2 class="mt-4">Previous events</h2>
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th><i class="fa-solid fa-bolt"></i> Event</th>
          <th><i class="fa-solid fa-calendar"></i> Date</th>
          <th><i class="fa-solid fa-clock"></i> Time</th>
          <th><i class="fa-solid fa-map-marker-alt"></i> Venue</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="e : ${previous}">
          <td><a th:href="@{/events/{id}(id=${e.id},returnTo='/events')}" th:text="${e.name}">My Event</a></td>
          <td th:text="${{e.date}}">Event date</td>
          <td th:text="${e.time != null ? e.time.getHour() + 1 + ':' + #temporals.format(e.time, 'mm') : ''}">15:00</td>
          <td>
            <span th:if="${e.venue != null}">
              <a th:href="@{/venues/{id}(id=${e.venue.id},returnTo='/events')}" th:text="${e.venue.name}">Venue</a>
            </span>
            <span th:if="${e.venue == null}">No venue</span>
          </td>
        </tr>
      </tbody>
    </table>
	
	<div class="card mt-4 mb-4" th:if="${mastodonPosts != null}">
	  
	  <div class="card-header bg-light">
	    <h3 class="h5 mb-0">
	      <i class="fa-solid fa-comments"></i> Social feed
	    </h3>
	  </div>

	  <table class="table table-striped table-hover mb-0">
	    <thead class="table-light">
	      <tr>
	        <th><i class="fa-solid fa-clock"></i> Time</th>
	        <th><i class="fa-solid fa-calendar"></i> Date</th>
	        <th><i class="fa-solid fa-comment"></i> Comment</th>
	      </tr>
	    </thead>

	    <tbody>
	      <tr th:each="post : ${mastodonPosts}">
	        
	       
			<td th:text="${post.createdAt != null and #strings.length(post.createdAt.toString()) >= 16 ? (T(java.lang.Integer).parseInt(#strings.substring(post.createdAt.toString(), 11, 13)) + 1) + ':' + #strings.substring(post.createdAt.toString(), 14, 16) : ''}">
			  13:50
			</td>

	   
	        <td th:text="${post.createdAt != null and #strings.length(post.createdAt.toString()) >= 10 ? #strings.substring(post.createdAt.toString(), 0, 10) : ''}">
	          2025-03-20
	        </td>

	      
	        <td>
	          <a th:href="${post.url}" target="_blank" th:utext="${post.content}">
	            Post content
	          </a>
	        </td>

	      </tr>
	    </tbody>
	  </table>

	  <div class="card-body" th:if="${#lists.isEmpty(mastodonPosts)}">
	    <p class="text-muted mb-0">No recent updates found.</p>
	  </div>

	</div>
	    
		
		

    
    <div id='map' class="mt-4"></div>

    <script th:inline="javascript">
        mapboxgl.accessToken = 'YOUR_MAPBOX_PUBLIC_TOKEN';
        var map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12',
            center: [-2.234, 53.467], 
            zoom: 12 
        });
        var events = /*[[${upcoming}]]*/ [];
        var bounds = new mapboxgl.LngLatBounds();
        var hasValidPins = false;

        // Group events by venue
        var venueMap = {};
        events.forEach(function(event) {
            if (event.venue && event.venue.longitude && event.venue.latitude) {
                var lng = event.venue.longitude;
                var lat = event.venue.latitude;
                if (lng !== 0.0 && lat !== 0.0) {
                    var key = lng + ',' + lat;
                    if (!venueMap[key]) {
                        venueMap[key] = { lng: lng, lat: lat, venueName: event.venue.name, events: [] };
                    }
                    var displayTime = '';
                    if (event.time) {
                        var timeParts = event.time.split(':');
                        var hour = (parseInt(timeParts[0]) + 1).toString().padStart(2, '0');
                        displayTime = hour + ':' + timeParts[1];
                    }
                    venueMap[key].events.push({ name: event.name, time: displayTime });
                }
            }
        });

        // Create one marker per venue with all its events in the popup
        Object.keys(venueMap).forEach(function(key) {
            var venue = venueMap[key];
            var popupText = '<strong style="font-size: 15px; color: #111; display: block; margin-bottom: 5px;">' + venue.venueName + '</strong>';
            venue.events.forEach(function(evt) {
                popupText += '<div style="font-size: 13px; color: #555; margin-bottom: 3px;">' + evt.name;
                if (evt.time) {
                    popupText += ' <span style="color: #888;">(' + evt.time + ')</span>';
                }
                popupText += '</div>';
            });

            var popup = new mapboxgl.Popup({ offset: 25, anchor: 'bottom' }).setHTML(popupText);
            new mapboxgl.Marker({ color: '#5cb8d2' }).setLngLat([venue.lng, venue.lat]).setPopup(popup).addTo(map);

            bounds.extend([venue.lng, venue.lat]);
            hasValidPins = true;
        });

        if (hasValidPins) {
            map.fitBounds(bounds, { padding: 50, maxZoom: 15 });
        }
    </script>
  </div>
</body>
</html>
